# "cut 80 seconds" has a length but no position: never "unreadable", never a guess. Three options; nothing changes until chosen.
brief: "Bare durations: '80 seconds' and 'a minute twenty' ask where; the first/last N seconds are applied"
fixture: single
steps:
  - say: "cut 80 seconds"
    expect: needs_clarification
    expect_options: 3
    expect_hash_unchanged: true
  - answer: 2
    expect: applied
    expect_duration_s: 120
  - say: "remove a minute twenty"
    expect: needs_clarification
    expect_options: 3
    expect_hash_unchanged: true
  - answer: 1
    expect: applied
    expect_duration_s: 40
