# Production override for the public demo VM. Use it together with the base file:
#   docker compose -f docker-compose.yml -f compose.prod.yml up -d --build
# Needs in .env: API_TOKEN (16+ chars, the API refuses to start without it), PUBLIC_HOST (<ip-with-dashes>.sslip.io)
# and PUBLIC_HOST_ALT (<ip.with.dots>.sslip.io): both spellings must work or one of them ends in ERR_SSL_PROTOCOL_ERROR.
# Only Caddy publishes ports (80, 443). `!reset` removes the ports the base file publishes for api (8080) and s3 (8333).

x-limits: &limits
  NODE_ENV: production
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-2048}
  # 3600 s = one hour. Longer videos fail their job right after the probe with VIDEO_TOO_LONG (422, details: duration and the limit).
  MAX_VIDEO_DURATION_S: ${MAX_VIDEO_DURATION_S:-3600}
  # Transcription of a 60-minute video takes about 41 minutes at the measured 0.69 of real time (REPORT.md); the default 3600 s would be tight.
  ASR_TIMEOUT_S: ${ASR_TIMEOUT_S:-7200}
  RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-120}
  MAX_INGEST_JOBS: ${MAX_INGEST_JOBS:-1}
  MAX_RENDER_JOBS: ${MAX_RENDER_JOBS:-1}
  # Download links point at the public door (Caddy forwards GET/HEAD of /<bucket>/* to storage). They use the dotted name
  # (PUBLIC_HOST_ALT). The signature covers the Host header, so such a link works on the dotted name only; the site itself
  # (API, docs, health) answers on both names.
  S3_PUBLIC_ENDPOINT: https://${PUBLIC_HOST_ALT:?set PUBLIC_HOST_ALT in .env, e.g. 34.93.140.79.sslip.io}

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST in .env}
      PUBLIC_HOST_ALT: ${PUBLIC_HOST_ALT:?set PUBLIC_HOST_ALT in .env, e.g. 34.93.140.79.sslip.io (the same IP with dots)}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-2048}
      S3_BUCKET: ${S3_BUCKET:-incubrix}
      PACK_USER: ${PACK_USER:?set PACK_USER in .env (basic auth of /pack/)}
      PACK_PASSWORD_HASH: ${PACK_PASSWORD_HASH:?set PACK_PASSWORD_HASH in .env (bcrypt, each $ doubled; see .env.example)}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Hard links to the session-pack outputs, read-only (scripts/build_pack.sh).
      - ./pack:/srv/pack:ro
      # The certificate lives in this volume: `down` keeps it, so a restart never asks Let's Encrypt again (rate limits).
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: { condition: service_started }
      s3: { condition: service_healthy }

  postgres:
    restart: unless-stopped

  s3:
    restart: unless-stopped
    ports: !reset []

  api:
    ports: !reset []
    environment:
      <<: *limits
      TRUST_PROXY: "true"

  worker:
    environment:
      <<: *limits

volumes:
  caddy_data:
  caddy_config:
