# docker compose up            -> postgres, s3, init (migrations + bucket), api, worker, asr (REAL models by default)
# docker compose run --rm tests -> npm test with its OWN Postgres, S3 and OpenTimelineIO service (the *-test services, own network); never touches the running stack
x-env: &env
  env_file:
    - .env.example
    - path: .env
      required: false

x-app: &app
  <<: *env
  build: .
  image: incubrix-app
  restart: unless-stopped

services:
  postgres:
    image: postgres:16
    <<: *env
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  # S3-compatible store. MinIO could not be pulled (see docs/REVIEW_INFRA.md), SeaweedFS is Apache-2.0.
  s3:
    image: chrislusf/seaweedfs:latest
    entrypoint: ["/bin/sh", "-c"]
    # Why the shell wrapper: SeaweedFS reads its admin identity from AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY.
    command:
      - >
        export AWS_ACCESS_KEY_ID="$$S3_ACCESS_KEY" AWS_SECRET_ACCESS_KEY="$$S3_SECRET_KEY";
        exec weed server -dir=/data -s3 -s3.port=8333 -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=256 -volume.max=80
    <<: *env
    # Published so download links (presigned, S3_PUBLIC_ENDPOINT) work from the host / a browser, not only inside compose.
    ports: ["8333:8333"]
    volumes: [s3data:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9333/cluster/status && nc -z localhost 8333"]
      interval: 3s
      timeout: 3s
      retries: 30

  init:
    <<: *app
    restart: "no"
    command: ["node", "scripts/init.ts"]
    depends_on:
      postgres: { condition: service_healthy }
      s3: { condition: service_healthy }

  api:
    <<: *app
    # tsx: the engine imports without file extensions and uses TS parameter properties, which plain `node` type stripping cannot run.
    command: ["node", "--import", "tsx", "apps/api/src/main.ts"]
    ports: ["8080:8080"]
    depends_on:
      init: { condition: service_completed_successfully }
      otio: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20

  worker:
    <<: *app
    command: ["node", "--import", "tsx", "apps/worker/src/main.ts"]
    depends_on:
      init: { condition: service_completed_successfully }
      asr: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8081/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Real faster-whisper + sherpa-onnx by default (ASR_PROVIDER / DIARIZATION_PROVIDER in .env.example).
  # /models is a named volume: it is filled from the image (base.en and the diarization models are baked in at build
  # time) on first start and kept across restarts, so nothing is downloaded again. Another ASR_MODEL downloads into it once.
  asr:
    <<: *env
    build: ./services/asr
    restart: unless-stopped
    volumes: [models:/models]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 3s
      timeout: 3s
      retries: 20

  # OpenTimelineIO export (the OpenTimelineIO Python library, Apache-2.0). Internal only: the API calls it.
  otio:
    <<: *env
    build: { context: ./services/otio, target: runtime }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/ready').status==200 else 1)"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Python tests of services/otio (every exported file is read back with the library). `tests` waits for it.
  otio-tests:
    build: { context: ./services/otio, target: test }
    profiles: ["test"]
    restart: "no"

  # Python tests of services/asr (mock adapters only, no model is loaded). `tests` waits for it.
  asr-tests:
    build: { context: ./services/asr, target: test }
    profiles: ["test"]
    restart: "no"

  # ---- TEST STACK -------------------------------------------------------------------------------------------------------
  # `docker compose run --rm tests` must never restart or touch the running stack (it once restarted the live Postgres, API and
  # worker). So `tests` depends only on the *-test services below: their own Postgres, S3 store, init and OpenTimelineIO service,
  # on their own network (`testnet`, the live services are not on it), with throwaway storage (tmpfs), test-only credentials
  # (never the live secrets) and their own image tag (building it does not retag `incubrix-app`, which the live containers use).
  # The *-test containers keep running after the tests (compose leaves dependencies up); scripts/test.sh removes them.
  postgres-test:
    image: postgres:16
    profiles: ["test"]
    environment: { POSTGRES_USER: incubrix, POSTGRES_PASSWORD: test-only-password, POSTGRES_DB: incubrix }
    tmpfs: [/var/lib/postgresql/data]
    networks: [testnet]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incubrix -d incubrix"]
      interval: 3s
      timeout: 3s
      retries: 20

  s3-test:
    image: chrislusf/seaweedfs:latest
    profiles: ["test"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        export AWS_ACCESS_KEY_ID="$$S3_ACCESS_KEY" AWS_SECRET_ACCESS_KEY="$$S3_SECRET_KEY";
        exec weed server -dir=/data -s3 -s3.port=8333 -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=256 -volume.max=80
    environment: { S3_ACCESS_KEY: test-only-access, S3_SECRET_KEY: test-only-secret-key-0123456789 }
    tmpfs: [/data]
    networks: [testnet]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9333/cluster/status && nc -z localhost 8333"]
      interval: 3s
      timeout: 3s
      retries: 30

  otio-test:
    build: { context: ./services/otio, target: runtime }
    profiles: ["test"]
    networks: [testnet]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/ready').status==200 else 1)"]
      interval: 3s
      timeout: 3s
      retries: 20

  init-test:
    <<: *app
    image: incubrix-test-app
    profiles: ["test"]
    restart: "no"
    command: ["node", "scripts/init.ts"]
    environment:
      DATABASE_URL: postgres://incubrix:test-only-password@postgres-test:5432/incubrix
      S3_ENDPOINT: http://s3-test:8333
      S3_ACCESS_KEY: test-only-access
      S3_SECRET_KEY: test-only-secret-key-0123456789
    networks: [testnet]
    depends_on:
      postgres-test: { condition: service_healthy }
      s3-test: { condition: service_healthy }

  tests:
    <<: *app
    image: incubrix-test-app
    profiles: ["test"]
    restart: "no"
    command: ["npm", "test"]
    networks: [testnet]
    environment:
      # Admin database of the TEST Postgres: the db tests create and drop their own databases.
      TEST_DATABASE_URL: postgres://incubrix:test-only-password@postgres-test:5432/postgres
      DATABASE_URL: postgres://incubrix:test-only-password@postgres-test:5432/incubrix
      S3_ENDPOINT: http://s3-test:8333
      S3_ACCESS_KEY: test-only-access
      S3_SECRET_KEY: test-only-secret-key-0123456789
      TEST_S3: "1"
      # Tests never use the real models or keys: mock providers, set explicitly; no key from a developer's .env reaches them.
      ASR_PROVIDER: mock
      DIARIZATION_PROVIDER: mock
      LLM_PROVIDER: rules
      EMBED_PROVIDER: mock
      GEMINI_API_KEY: ""
      GROQ_API_KEY: ""
      API_TOKEN: ""
      # The export tests use the real OpenTimelineIO service (the API tests also run the mock exporter).
      TEST_OTIO_URL: http://otio-test:8001
    depends_on:
      init-test: { condition: service_completed_successfully }
      asr-tests: { condition: service_completed_successfully }
      otio-tests: { condition: service_completed_successfully }
      otio-test: { condition: service_healthy }

networks:
  testnet: {}

volumes:
  pgdata:
  s3data:
  models:
