# docker compose up            -> postgres, s3, init (migrations + bucket), api, worker, asr (REAL models by default)
# docker compose run --rm tests -> npm test with real Postgres and S3 (integration tests included)
x-env: &env
  env_file:
    - .env.example
    - path: .env
      required: false

x-app: &app
  <<: *env
  build: .
  image: incubrix-app
  restart: unless-stopped

services:
  postgres:
    image: postgres:16
    <<: *env
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  # S3-compatible store. MinIO could not be pulled (see docs/REVIEW_INFRA.md), SeaweedFS is Apache-2.0.
  s3:
    image: chrislusf/seaweedfs:latest
    entrypoint: ["/bin/sh", "-c"]
    # Why the shell wrapper: SeaweedFS reads its admin identity from AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY.
    command:
      - >
        export AWS_ACCESS_KEY_ID="$$S3_ACCESS_KEY" AWS_SECRET_ACCESS_KEY="$$S3_SECRET_KEY";
        exec weed server -dir=/data -s3 -s3.port=8333 -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=256 -volume.max=40
    <<: *env
    volumes: [s3data:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9333/cluster/status && nc -z localhost 8333"]
      interval: 3s
      timeout: 3s
      retries: 30

  init:
    <<: *app
    restart: "no"
    command: ["node", "scripts/init.ts"]
    depends_on:
      postgres: { condition: service_healthy }
      s3: { condition: service_healthy }

  api:
    <<: *app
    # tsx: the engine imports without file extensions and uses TS parameter properties, which plain `node` type stripping cannot run.
    command: ["node", "--import", "tsx", "apps/api/src/main.ts"]
    ports: ["8080:8080"]
    depends_on:
      init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20

  worker:
    <<: *app
    command: ["node", "--import", "tsx", "apps/worker/src/main.ts"]
    depends_on:
      init: { condition: service_completed_successfully }
      asr: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8081/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Real faster-whisper + sherpa-onnx by default (ASR_PROVIDER / DIARIZATION_PROVIDER in .env.example).
  # /models is a named volume: it is filled from the image (base.en and the diarization models are baked in at build
  # time) on first start and kept across restarts, so nothing is downloaded again. Another ASR_MODEL downloads into it once.
  asr:
    <<: *env
    build: ./services/asr
    restart: unless-stopped
    volumes: [models:/models]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Python tests of services/asr (mock adapters only, no model is loaded). `tests` waits for it.
  asr-tests:
    build: { context: ./services/asr, target: test }
    profiles: ["test"]
    restart: "no"

  tests:
    <<: *app
    profiles: ["test"]
    restart: "no"
    command: ["npm", "test"]
    environment:
      # Admin database of the compose Postgres: the db tests create and drop their own databases.
      TEST_DATABASE_URL: postgres://incubrix:incubrix-dev@postgres:5432/postgres
      TEST_S3: "1"
      # Tests never use the real models: mock providers, set explicitly.
      ASR_PROVIDER: mock
      DIARIZATION_PROVIDER: mock
      LLM_PROVIDER: rules
    depends_on:
      init: { condition: service_completed_successfully }
      asr-tests: { condition: service_completed_successfully }

volumes:
  pgdata:
  s3data:
  models:
