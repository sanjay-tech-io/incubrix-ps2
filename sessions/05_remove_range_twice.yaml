# Hard case: "remove 0:30-0:40" sent twice. Times are on the CURRENT timeline, so the second one removes the next 10 s
# (the answer states the policy); with "original" the second one finds nothing left to remove.
name: 05_remove_range_twice
video: media/test_single.mp4
num_speakers: 1
steps:
  - say: remove 0:30-0:40
    expect: applied
  - say: remove 0:30-0:40
    expect: applied
  - say: remove 1:00-1:10 of the original
    expect: applied
  - say: remove 1:00-1:10 of the original
    expect: applied   # nothing left in that range: the engine says so instead of cutting something else
