# Hard case: a phone-style variable-frame-rate video. Accepted with a warning; the render goes through a CFR proxy.
name: 14_variable_frame_rate_phone
video: media/vfr_speech.mp4
num_speakers: 1
ai_generated: true
rights: espeak-ng synthetic speech, generated by scripts/make_session_media.sh
steps:
  - say: add a caption "Welcome!" on "welcome to the channel"
    expect: applied
  - say: cut 0:05-0:08
    expect: applied
  - say: speed up 0:08-0:12 by 2x
    expect: applied
  - render: true
    expect: succeeded
