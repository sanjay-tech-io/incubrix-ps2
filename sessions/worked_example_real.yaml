# The brief's 8-step worked example on the REAL single-speaker recording media/test_single.mp4 (not in git), with REAL ASR.
# Deviations from the brief's script, all caused by what the recording actually contains (details: docs/WORKED_EXAMPLE_REAL.md):
#  - step 1: the recording says "welcome to our channel" (about 0:39.5), not "welcome to the channel" (0:42 in the brief);
#  - step 3: "pricing" is mentioned 7 times in this recording (the brief's script has 3), so the question has 7 options;
#    the answer "the second one" is the brief's.
# Steps 2, 4, 5, 6, 7 and 8 are the brief's, word for word.
name: worked_example_real
description: caption, cut first 30 s, ambiguous pricing (7 mentions) then "the second one", speed 2x, put the intro back, undo, recolour the caption, render
video: media/test_single.mp4
num_speakers: 1
rights: own recording, consent self
steps:
  - say: 'Add a caption "Welcome!" when I say "welcome to our channel"'
    expect: applied
  - say: cut the first 30 seconds
    expect: applied
  - say: remove the part about pricing
    expect: needs_clarification
    expect_options: 7
  - say: the second one
    expect: applied
  - say: speed up 1:00-1:30 by 2x
    expect: applied
  - say: put the intro back
    expect: applied
  - say: undo
    expect: applied
  - say: make that caption red
    expect: applied
  - render: true
    expect: succeeded
