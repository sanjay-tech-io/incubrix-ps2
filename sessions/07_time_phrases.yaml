# Hard cases: "80 seconds", "a minute twenty", "the last 10 seconds".
name: 07_time_phrases
video: media/test_single.mp4
num_speakers: 1
steps:
  - say: cut from 80 seconds to 85 seconds
    expect: applied
  - say: cut from a minute twenty to a minute twenty five
    expect: applied
  - say: cut the last 10 seconds
    expect: applied
  - say: cut the last 10 minutes
    expect: rejected   # longer than the video
