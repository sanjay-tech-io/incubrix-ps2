# Frame check companion of worked_example_real.yaml: renders the caption (made red at once so scripts/caption_frames.mjs can find it)
# BEFORE the cut, AFTER the cut and AFTER the restore, on the same recording. Renders are 720p (RENDER_MAX_HEIGHT=720), so this is NOT the
# full-resolution render; the full-resolution one is test-pack/real/worked_example_real/render_1.mp4.
# Kept out of sessions/ so `npm run batch -- sessions` does not run it twice.
name: worked_example_real_frames
video: media/test_single.mp4
num_speakers: 1
rights: own recording, consent self
steps:
  - say: 'Add a caption "Welcome!" when I say "welcome to our channel"'
    expect: applied
  - say: make that caption red
    expect: applied
  - render: true
    expect: succeeded
  - say: cut the first 30 seconds
    expect: applied
  - render: true
    expect: succeeded
  - say: remove the part about pricing
    expect: needs_clarification
  - say: the second one
    expect: applied
  - say: speed up 1:00-1:30 by 2x
    expect: applied
  - say: put the intro back
    expect: applied
  - render: true
    expect: succeeded
